# Cell descriptor read by tamp_core (tamp_core/scripts/cell_registry.py). Paths are relative to
# this directory. A scene without `cell:` runs on this cell.
name: dual
package: multi_robot_moveit_config
moveit:
  urdf: multi_robot_moveit_config/config/multi_robot_cell.urdf.xacro
  srdf: multi_robot_moveit_config/config/multi_robot_cell.srdf
  joint_limits: multi_robot_moveit_config/config/joint_limits.yaml
  # multi_robot_moveit_config's own moveit_controllers.yaml is fully commented out and
  # to_moveit_configs() chokes on it; the bringup copy is the working one.
  controllers: multi_robot_cell_bringup/config/moveit_controllers.yaml
scenes: scenes
vamp:
  placement: dual        # CELL_BASE / CELL_MOUNT_YAW of vamp_collision_engine.py, one shared engine
  modules:
    ur10e_rail:          # UR10e + rail + Robotiq 2F-85 (97 spheres; 18 structural rail spheres first)
      dir: vamp_modules/ur10e_rail
      n_structural: 18
      finger_patch: true # fingertip patch spheres: on for cells with a layout, off here (VAMP_FINGER_PATCH=1)
