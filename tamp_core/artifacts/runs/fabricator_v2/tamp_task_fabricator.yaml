# TAMP application scene -- "fabricator": fitting and MIG welding of plates on a beam,
# 4 robots, modelled on the Voortman Fabricator. GENERATED by
# thesis_material_tamp/tools/make_fabricator.py -- re-run it, do not edit the numbers.
#
# THE INDUSTRIAL CASE. The Voortman Fabricator (Voortman Steel Machinery with Valk Welding)
# fits and welds plates onto structural beams with 3 Panasonic welding robots and 1 handling
# robot: the handler picks a plate and HOLDS it in position while one welder tack-welds it,
# then lets go; while the next plate is placed and tacked the other welders finish the seams
# of the previous one (voortman.net/en/products/fabricator; valkwelding.com news). A research
# twin with 1 gripping + 4 welding robots on linear tracks: Zheng et al., PLoS One 20(9)
# e0331515, 2025.
#
# THIS CELL is one working zone of such a machine, compacted so that all four robots share
# the beam: robot1 (+y, rail along x) is the HANDLER with the Robotiq gripper and takes the
# plates from a plate table behind it; robot2 (-y, rail along x), robot3 (-x) and robot4 (+x,
# short rails along y) are WELDERS with a MIG torch (cell `fabricator4`, layout in
# multi_robot_cell_description/urdf/fabricator4_layout.yaml). The beam is presented WEB
# HORIZONTAL (the rotators' presentation for this pass) on two painted trestles; the FIN
# PLATES (connection plates for secondary beams) stand on the web along the beam axis and
# stick out 100 mm above the flanges; the end plates close the beam ends.
#
# WORK: 6 plates (4 fin plates + 2 end plates); per plate 1 pick-place (robot1)
# with a HOLD (the plate stays gripped at its place pose while it is tacked: precedence
# `hold`), 1 tack of two 20 mm spots run by one welder (`legs:`), then the fillet seams:
# a fin plate has one along each face (plate-web), an end plate three (web and both flanges),
# MIG at 9 mm/s. Each seam lists the welders that reach it with the rail
# held still (fabricator_reach.py, kinematic gate); collisions are the generator's.

cell: fabricator4
discretisation:
  delta_t:            0.025
  gripper_dwell_slots: 40
  process_dwell_slots: 12      # 0.30 s arc strike / 0.30 s crater fill
  max_joint_step_warn: 0.15
  max_cartesian_step_warn: 0.02

planning:
  planner_id:      RRTConnectkConfigDefault
  planning_time:   20.0
  planning_attempts: 10
  vel_scale:       0.45        # 0.5 gave 0.0219 m of link travel per slot (> 0.02, ADR-0006)
  acc_scale:       0.45
  approach:        0.13
  cartesian_step:  0.005
  max_link_speed:  0.7         # m/s; x delta_t 0.025 = 0.0175 m per slot
  process_speed:   0.009
  hold_slack_s:    2.0
  seed:            7

robots:
  robot1:
    tool:           gripper
    planning_group: manipulator1_on_rail
    arm_group:      manipulator1
    ee_link:        robot1_tool0
    attach_link:    robot1_robotiq_85_base_link
    gripper_action: /robot1_gripper_action_controller/gripper_cmd
    gripper_open:   0.0
    gripper_close:  0.5
    home:
      robot1_linear_guide_joint: 0.0
      robot1_shoulder_pan_joint: 0.0
      robot1_shoulder_lift_joint: -2.6035
      robot1_elbow_joint: 2.1348
      robot1_wrist_1_joint: -1.1455
      robot1_wrist_2_joint: -1.7358
      robot1_wrist_3_joint: 0.0
    touch_links:
