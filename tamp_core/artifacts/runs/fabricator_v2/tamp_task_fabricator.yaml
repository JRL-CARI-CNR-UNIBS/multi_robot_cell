# pick-place -> tack: HOLD (the handler keeps the plate gripped at its place pose until the
# tack's arc is out; the tack may strike once the plate has arrived). tack -> every other
# seam of that plate (the generator derives `gate`: no strike before the tack is done).
precedences:
  - [pp_fin_1, t_fin_1, hold]
  - [t_fin_1, w_fin_1_p]
  - [t_fin_1, w_fin_1_m]
  - [pp_fin_2, t_fin_2, hold]
  - [t_fin_2, w_fin_2_p]
  - [t_fin_2, w_fin_2_m]
  - [pp_fin_3, t_fin_3, hold]
  - [t_fin_3, w_fin_3_p]
  - [t_fin_3, w_fin_3_m]
  - [pp_fin_4, t_fin_4, hold]
  - [t_fin_4, w_fin_4_p]
  - [t_fin_4, w_fin_4_m]
  - [pp_end_m, t_end_m, hold]
  - [t_end_m, w_end_m_web]
  - [t_end_m, w_end_m_fp]
  - [t_end_m, w_end_m_fm]
  - [pp_end_p, t_end_p, hold]
  - [t_end_p, w_end_p_web]
  - [t_end_p, w_end_p_fp]
  - [t_end_p, w_end_p_fm]
# An end plate's seams before the fin plate nearest it is picked (`gate`: the fin's pick
# waits for the arc-out): the torch on the end plate's inner face reaches over that fin.
  - [w_end_m_web, pp_fin_1, gate]
  - [w_end_m_fp, pp_fin_1, gate]
  - [w_end_m_fm, pp_fin_1, gate]
  - [w_end_p_web, pp_fin_4, gate]
  - [w_end_p_fp, pp_fin_4, gate]
  - [w_end_p_fm, pp_fin_4, gate]
