# TAMP application scene -- "biw_panel": a framing / respot station on a real-looking panel.
#
# WHAT IT IS
#
# The successor of the `biw` scene's "50 mm maschera" idea. One large INNER BODY PANEL
# (0.56 x 0.30 m: web with a shallow crown, two stiffening beads, two lightening holes and a
# 25 mm perimeter flange, a triangle mesh) is already clamped in its jig from the previous
# station. Two identically equipped robots take three small REINFORCEMENTS from a rack outside
# the work zone (two hat sections and one angle bracket, meshes), set each on the panel and then
# SPOT-WELD it: four points per part, two tacks then two closing points. The cell is HOMOGENEOUS:
# either robot can do every task, so points can be rebalanced. Same baseline as `biw`: the shared
# volume is what a PLC arbitrates with an interference zone (`schedule:=turn_based`); the
# forbidden-offset model lets both arms work in it at once.
#
# Assets are generated by `thesis_material_tamp/tools/make_panel.py` (numpy only), which also
# prints the fixtures, places and `welds:` of this file from the geometry it built -- so the
# numbers below are not typed by hand. A downloaded model is normalised with
# `thesis_material_tamp/tools/mesh_prep.py` (`--units mm --max-tri 5000 --thicken 0.02`).
#
# WHAT THE PLANNER SEES (ADR-0003, mesh addendum; `size` is the bounding box of each mesh)
#   * fixtures: the panel is its MESH; the jig is boxes.
#   * the object of the task being planned: its mesh (spawn, carried, place).
#   * every OTHER object, and every place slot: its bounding box (conservative).
#   * mu (robot-robot collision) never sees a fixture; it sees the carried object as the sphere
#     circumscribing its bounding box: 0.070 m (hat) and 0.065 m (angle), both < 0.08 m.
#
# THICKNESS POLICY (ADR-0006)
#
# The panel is a SOLID 20 mm proxy, not a 1 mm sheet. At delta_t 0.025 s and vel/acc 0.5 the
# fastest link travels 0.0187 m per slot (the generator prints it), so an obstacle thinner than
# that can be stepped over between two control samples; 10 mm would violate the rule, 20 mm
# satisfies it -- the same argument as `biw`'s 50 mm maschera and `tower`'s 20 mm tray walls.
# Every jig box is >= 20 mm in every dimension for the same reason. The reinforcements are 2 mm
# sheet because they are only ever carried (attached to the gripper); a placed one is a
# 40 x 60 x 120 mm bounding box in the weld scenes.
#
# THE TOOL IS A PROXY
#
# There is no welding gun in the URDF. The Robotiq 2F-85 stands for the spot-welding gun:
# grasping, kinematics, trajectories, collision geometry and timing are real, the gun is not.
# The two fingers are open (85 mm) and straddle the point; they end ~0.147 m below tool0
# (measured). `tool.z = 0.22`, as in `biw`, therefore holds the fingertips ~7 cm above the
# flange and ~3.5 cm above the top of a placed hat. Measured margins (generator, 2026-09-21):
# all 12 points plan at tool.z = 0.19 and fail at 0.18 (the fingers meet the placed part's
# bounding box, 38 mm above the flange face); on the bare panel flange a point plans down to 0.16
# and fails at 0.14.
#
# SPOT WELDS
#
# A spot is a weld task with a 2 mm seam (`start`/`end` 2 mm apart along +x). Nothing in the
# generator needs a longer one: `planCartesianStep` gets a 2 mm delta (one interpolator step,
# not the 5 mm `cartesian_step`), `timeParameteriseAtSpeed` runs it at 0.05 m/s = 0.04 s = one
# `Processing` sample, and the dwells carry the process. `process_dwell_slots: 16` = 0.40 s
# squeeze + 0.40 s hold: 0.825 s per point (resistance spot welding: squeeze, weld and hold
# together take 0.5-1 s). Each point sits on the UPPER face of a flange (z = flange bottom
# + 2 mm sheet), on the mid-line of the flange (hat: y = +-23 mm; angle: two rows on its foot),
# 35 mm from the part's end. The tool axis follows the local normal of the panel surface (roll
# and pitch of `start`/`end`, computed by make_panel.py); the reinforcements are set level and the
# panel is only gently curved, so the tilts are 0.1-0.9 deg -- the check is that the normal was
# used, not a demanding orientation. Margin (measured): the whole set plans with an added tilt
# of 15 deg about y and 30 deg about x; 30 deg about y loses points (fingers meet the part).
#
# FIT-UP GAP: 1 mm, as in `biw`. Each reinforcement is placed with its centre at
# (highest panel surface under its flanges) + 1 mm + 20 mm, so it rests on its flanges; the
# support allowance admits only object-vs-table_top, and FCL calls zero clearance a collision,
# so a part on a mesh fixture needs a strictly positive gap. Measured: a hat 2 mm into the
# panel does not plan (both robots), 1 mm above it does.
#
# GEOMETRY (metres; world frame; table top z = 0.75)
#
#   panel      bbox centre (0.100, 0.000, 0.7878), 0.560 x 0.300 x 0.0335; crown top at z = 0.8045,
#              perimeter flange underside at 0.771 (over two 20 mm support rails, 1 mm clear)
#   hats       0.120 x 0.060 x 0.040, flanges 14 mm wide, centres (-0.065, 0) and (0.265, 0)
#   angle      0.100 x 0.070 x 0.040, centre (0.100, 0); its wall is along its -y edge
#   rack       hats at (-0.60, -+0.10), angle at (0.52, 0.0), all standing on the table
#   grasp      hats: fingers close across the 60 mm width (yaw 1.5708) on the walls of the profile;
#              angle: fingers pinch the 2 mm wall (grasp y = -0.034, the wall's centre line)
#   x range    weld points from x = -0.10 to 0.30, all at |y| <= 0.024: comfortably inside the
#              band both arms reach (x -0.8..0.6, y +-0.18, z 0.76..1.13)
#
# PRECEDENCES are LOCAL to each reinforcement: place -> its four points (both `pipeline` and
# `gate`, derived by the generator), and each tack (points a1, b2, on opposite flanges) ->
# each closing point (a2, b1) with `gate`. No order between reinforcements.
#
# Everything from `discretisation:` to `base_frame:` is CELL geometry copied verbatim from
# tamp_task_biw.yaml, except `process_dwell_slots`.

discretisation:
  delta_t:            0.025
  gripper_dwell_slots: 40
  process_dwell_slots: 16      # 0.40 s squeeze / 0.40 s hold
  max_joint_step_warn: 0.15
  max_cartesian_step_warn: 0.02

planning:
  planner_id:      RRTConnectkConfigDefault
  planning_time:   20.0
  planning_attempts: 10
  vel_scale:       0.5
  acc_scale:       0.5
  approach:        0.12
  cartesian_step:  0.005
  process_speed:   0.05
  seed:            7

robots:
  robot1:
    planning_group: manipulator1_on_rail
    arm_group:      manipulator1
    ee_link:        robot1_tool0
    attach_link:    robot1_robotiq_85_base_link
    gripper_action: /robot1_gripper_action_controller/gripper_cmd
    gripper_open:   0.0
    gripper_close:  0.5
    home:
      robot1_linear_guide_joint:  0.0
      robot1_shoulder_pan_joint:  0.0
      robot1_shoulder_lift_joint: -2.6035
      robot1_elbow_joint:         2.1348
      robot1_wrist_1_joint:       -1.1455
      robot1_wrist_2_joint:       -1.7358
      robot1_wrist_3_joint:       0.0
    touch_links:
      - robot1_robotiq_85_base_link
      - robot1_robotiq_85_left_finger_link
      - robot1_robotiq_85_left_finger_tip_link
      - robot1_robotiq_85_left_inner_knuckle_link
      - robot1_robotiq_85_left_knuckle_link
      - robot1_robotiq_85_right_finger_link
      - robot1_robotiq_85_right_finger_tip_link
      - robot1_robotiq_85_right_inner_knuckle_link
      - robot1_robotiq_85_right_knuckle_link

  robot2:
    planning_group: manipulator2_on_rail
    arm_group:      manipulator2
    ee_link:        robot2_tool0
    attach_link:    robot2_robotiq_85_base_link
    gripper_action: /robot2_gripper_action_controller/gripper_cmd
    gripper_open:   0.0
    gripper_close:  0.5
    home:
      robot2_linear_guide_joint:  0.0
      robot2_shoulder_pan_joint:  0.0
      robot2_shoulder_lift_joint: -2.6035
      robot2_elbow_joint:         2.1348
      robot2_wrist_1_joint:       -1.1455
      robot2_wrist_2_joint:       -1.7358
      robot2_wrist_3_joint:       0.0
    touch_links:
      - robot2_robotiq_85_base_link
      - robot2_robotiq_85_left_finger_link
      - robot2_robotiq_85_left_finger_tip_link
      - robot2_robotiq_85_left_inner_knuckle_link
      - robot2_robotiq_85_left_knuckle_link
      - robot2_robotiq_85_right_finger_link
      - robot2_robotiq_85_right_finger_tip_link
      - robot2_robotiq_85_right_inner_knuckle_link
      - robot2_robotiq_85_right_knuckle_link

base_frame: world

# The panel (a mesh) and its jig (boxes): a base plate under the web, two support rails under the
# long flange edges, a datum bar against the -x end and a clamp (post + arm) over the +x end.
# Six jig boxes on purpose: the scene visualiser's /collision_object burst drops objects beyond
# ~11 in all (panel + jig + 3 racked parts = 10 here).
fixtures:
  - id: body_panel
    size: [0.5600, 0.3000, 0.0335]
    mesh: {file: meshes/body_panel_biw.stl}
    pose: {x: 0.1000, y: 0.0000, z: 0.7878}
  - {id: jig_base, size: [0.4000, 0.1900, 0.0279], pose: {x: 0.1000, y: 0.0000, z: 0.7640}}
  - {id: jig_rail_my, size: [0.4400, 0.0300, 0.0200], pose: {x: 0.1000, y: -0.1375, z: 0.7600}}
  - {id: jig_rail_py, size: [0.4400, 0.0300, 0.0200], pose: {x: 0.1000, y: 0.1375, z: 0.7600}}
  - {id: jig_loc_x, size: [0.0300, 0.1000, 0.0320], pose: {x: -0.1960, y: 0.0000, z: 0.7660}}
  - {id: jig_clamp_post, size: [0.0300, 0.0600, 0.0880], pose: {x: 0.4250, y: 0.0000, z: 0.7940}}
  - {id: jig_clamp_arm, size: [0.0500, 0.0600, 0.0200], pose: {x: 0.3950, y: 0.0000, z: 0.8085}}


# Racked reinforcements: 0.12 x 0.06 x 0.04 hats (walls gripped, fingers across the width) and a
# 0.10 x 0.07 x 0.04 angle bracket (the fingers pinch its wall). Bottoms on the table (z 0.75).
objects:
  - id: hat_1
    size: [0.12, 0.06, 0.04]
    mesh: {file: meshes/reinf_hat_biw.stl}
    spawn: {x: -0.6, y: -0.1, z: 0.770}
    grasp: {x: 0.0, y: 0.0, z: 0.16, roll: 3.14159, yaw: 1.5708}
  - id: hat_2
    size: [0.12, 0.06, 0.04]
    mesh: {file: meshes/reinf_hat_biw.stl}
    spawn: {x: -0.6, y: 0.1, z: 0.770}
    grasp: {x: 0.0, y: 0.0, z: 0.16, roll: 3.14159, yaw: 1.5708}
  - id: angle_1
    size: [0.10, 0.07, 0.04]
    mesh: {file: meshes/reinf_angle_biw.stl}
    spawn: {x: 0.52, y: 0.0, z: 0.770}
    grasp: {x: 0.0, y: -0.034, z: 0.16, roll: 3.14159, yaw: 1.5708}


# Place = the reinforcement's bounding-box centre: highest panel surface under it + 1 mm + 20 mm.
tasks:
  - {id: t_hat_1, object: hat_1, place: {x: -0.0650, y: 0.0000, z: 0.8252}}
  - {id: t_angle_1, object: angle_1, place: {x: 0.1000, y: 0.0000, z: 0.8255}}
  - {id: t_hat_2, object: hat_2, place: {x: 0.2650, y: 0.0000, z: 0.8252}}

# Twelve spot welds, <part>_<flange/row a|b><1|2>. start/end are 2 mm apart along +x; their
# roll/pitch are the panel's local normal; the tool is 0.22 m along it, gripper pointing down.
welds:
  - {id: w_hat_1_a1, start: {x: -0.1010, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: -0.0092}, end: {x: -0.0990, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: -0.0092}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_hat_1_a2, start: {x: -0.0310, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: -0.0060}, end: {x: -0.0290, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: -0.0060}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_hat_1_b1, start: {x: -0.1010, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: -0.0092}, end: {x: -0.0990, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: -0.0092}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_hat_1_b2, start: {x: -0.0310, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: -0.0060}, end: {x: -0.0290, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: -0.0060}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_angle_1_a1, start: {x: 0.0660, y: 0.0000, z: 0.8075, roll: 0.0000, pitch: -0.0015}, end: {x: 0.0680, y: 0.0000, z: 0.8075, roll: 0.0000, pitch: -0.0015}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_angle_1_a2, start: {x: 0.1320, y: 0.0000, z: 0.8075, roll: 0.0000, pitch: 0.0015}, end: {x: 0.1340, y: 0.0000, z: 0.8075, roll: 0.0000, pitch: 0.0015}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_angle_1_b1, start: {x: 0.0660, y: 0.0240, z: 0.8075, roll: -0.0123, pitch: -0.0015}, end: {x: 0.0680, y: 0.0240, z: 0.8075, roll: -0.0123, pitch: -0.0015}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_angle_1_b2, start: {x: 0.1320, y: 0.0240, z: 0.8075, roll: -0.0123, pitch: 0.0015}, end: {x: 0.1340, y: 0.0240, z: 0.8075, roll: -0.0123, pitch: 0.0015}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_hat_2_a1, start: {x: 0.2290, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: 0.0060}, end: {x: 0.2310, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: 0.0060}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_hat_2_a2, start: {x: 0.2990, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: 0.0092}, end: {x: 0.3010, y: -0.0230, z: 0.8072, roll: 0.0118, pitch: 0.0092}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_hat_2_b1, start: {x: 0.2290, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: 0.0060}, end: {x: 0.2310, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: 0.0060}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}
  - {id: w_hat_2_b2, start: {x: 0.2990, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: 0.0092}, end: {x: 0.3010, y: 0.0230, z: 0.8072, roll: -0.0118, pitch: 0.0092}, tool: {x: 0.0, y: 0.0, z: 0.22, roll: 3.14159}, speed: 0.05}

# Local to each reinforcement: place -> points, tack (a1, b2) -> closing (a2, b1).
precedences:
  - [t_hat_1, w_hat_1_a1]
  - [t_hat_1, w_hat_1_a2]
  - [t_hat_1, w_hat_1_b1]
  - [t_hat_1, w_hat_1_b2]
  - [w_hat_1_a1, w_hat_1_a2]
  - [w_hat_1_a1, w_hat_1_b1]
  - [w_hat_1_b2, w_hat_1_a2]
  - [w_hat_1_b2, w_hat_1_b1]
  - [t_angle_1, w_angle_1_a1]
  - [t_angle_1, w_angle_1_a2]
  - [t_angle_1, w_angle_1_b1]
  - [t_angle_1, w_angle_1_b2]
  - [w_angle_1_a1, w_angle_1_a2]
  - [w_angle_1_a1, w_angle_1_b1]
  - [w_angle_1_b2, w_angle_1_a2]
  - [w_angle_1_b2, w_angle_1_b1]
  - [t_hat_2, w_hat_2_a1]
  - [t_hat_2, w_hat_2_a2]
  - [t_hat_2, w_hat_2_b1]
  - [t_hat_2, w_hat_2_b2]
  - [w_hat_2_a1, w_hat_2_a2]
  - [w_hat_2_a1, w_hat_2_b1]
  - [w_hat_2_b2, w_hat_2_a2]
  - [w_hat_2_b2, w_hat_2_b1]
