# TAMP application scene -- "biw_door": marriage and respot of a REAL car door, at 1:2.
#
# WHAT IT IS
#
# The body-shop step after the inner and outer sub-assemblies of a front door are built: the
# OUTER SKIN lies face down in a nest, one robot takes the INNER SUB-ASSEMBLY (inner panel with
# its integral window frame and the reinforcements already welded to it) from a rack and sets
# it onto the skin, then both robots spot-weld the flanges where the two meet, on four edges of
# the door. The cell is HOMOGENEOUS: either robot may do any task. Baseline as in `biw`: the PLC
# interference zone (`schedule:=turn_based`); this pipeline lets both arms work in it at once.
#
# The geometry is a CATIA STEP assembly of a real door (config/meshes/Car_Assembly/Product1.stp,
# 21 sheet-metal parts; a model from a Gumroad seller -- check its licence before publishing
# renders). `thesis_material_tamp/tools/door_prep.py` turns it into this file: it splits the
# assembly, finds where the skin touches the inner (the flange overlaps), opens the hems (the CAD
# door is hemmed; at the marriage the hem flanges still stand open), builds the collision proxies,
# the nest and the rack, picks the weld spots and prints everything below `base_frame:`. The
# numbers are not typed by hand: re-run the tool instead of editing them.
#
# SCALE 1:2. At 1:1 the inner sub-assembly is 1.16 x 1.06 m: it overhangs the 0.9 m table
# towards both rails, leaves no room for its rack beside the nest, and its carried-object sphere
# in mu (half its bbox diagonal) would be ~0.8 m in radius. At 1:2 the door is 0.59 x 0.56 m,
# the envelope `biw_panel` validated; every flange overlap and weld spot is the CAD's, scaled.
#
# WHAT THE PLANNER SEES
#   * fixtures: the outer sub-assembly (skin + the outer belt reinforcement, which lies under the
#     skin's belt flange) is its MESH; the nest and rack pads are 40 x 40 mm boxes (>= 20 mm tall).
#   * the inner: its mesh while it is picked, carried and placed; after the marriage the welds see
#     it as its mesh too (`placed_meshes: true`, below) -- its bounding box would bury every flange.
#   * `supports: [door_outer]`: the inner may touch the skin during the place descent, GripOpen and
#     retreat, exactly as any object may touch the table. The CAD sheets touch at the flanges
#     (mid-surfaces ~0.07 mm apart at 1:2), so the place pose is the CAD pose, not a lifted one.
#   * mu (robot-robot) sees the carried inner as one sphere of radius 0.415 m (+ margin): while it
#     is carried the other arm keeps clear of it -- conservative, and what an interference zone
#     around a large-part handler imposes anyway.
#
# COLLISION PROXIES (ADR-0006). Each sheet is a 20 mm solid grown AWAY from the other sheet, so
# the proxies do not interpenetrate where the sheets touch (shortened where a flange rests on, or
# is sandwiched by, the other part); the 13 small brackets are closed convex hulls. Outer 4.1k,
# inner 8.7k triangles (a ~5k-triangle mesh costs ~2x a box, CONTEXT.md).
#
# THE TOOL IS A PROXY. As in `biw_panel`, the Robotiq 2F-85 stands for the spot gun (`tool.z
# 0.22`, fingers open), and, at the marriage, for the handling tool (fingertips 5 mm above the
# inner's top on its centre axis: a vacuum/magnet gripper). The gun axis is the local flange
# normal; where a wall of the inner rises next to the flange it leans OUT of the door by 15 or
# 30 deg (a proxy for a C-gun reaching round the flange). A spot is 2 mm long and dwells 16 + 16
# slots: squeeze/weld/hold ~0.83 s.
#
# WELDS. 11 spots on the four edges of the skin (front 4, rear 2, bottom 3, belt 2), taken on the
# skin's outline where it overlaps the inner (interior contacts, e.g. the intrusion beam, are
# bonded, not welded). PRECEDENCES: the marriage precedes every spot; on each edge one tack
# (`..t`, the spot nearest the edge's middle) precedes the other spots of that edge.
#
# Everything from `discretisation:` to `base_frame:` is CELL geometry copied from
# tamp_task_biw_panel.yaml, plus `planning.placed_meshes`.

discretisation:
  delta_t:            0.025
  gripper_dwell_slots: 40
  process_dwell_slots: 16      # 0.40 s squeeze / 0.40 s hold
  max_joint_step_warn: 0.15
  max_cartesian_step_warn: 0.02

planning:
  planner_id:      RRTConnectkConfigDefault
  planning_time:   20.0
  planning_attempts: 10
  vel_scale:       0.5
  acc_scale:       0.5
  approach:        0.12
  cartesian_step:  0.005
  process_speed:   0.05
  seed:            7
  placed_meshes:   true        # the placed inner is its mesh for the welds, not its bbox

robots:
  robot1:
    planning_group: manipulator1_on_rail
    arm_group:      manipulator1
    ee_link:        robot1_tool0
    attach_link:    robot1_robotiq_85_base_link
    gripper_action: /robot1_gripper_action_controller/gripper_cmd
    gripper_open:   0.0
    gripper_close:  0.5
    home:
      robot1_linear_guide_joint:  0.0
      robot1_shoulder_pan_joint:  0.0
      robot1_shoulder_lift_joint: -2.6035
      robot1_elbow_joint:         2.1348
      robot1_wrist_1_joint:       -1.1455
      robot1_wrist_2_joint:       -1.7358
      robot1_wrist_3_joint:       0.0
    touch_links:
      - robot1_robotiq_85_base_link
      - robot1_robotiq_85_left_finger_link
      - robot1_robotiq_85_left_finger_tip_link
      - robot1_robotiq_85_left_inner_knuckle_link
      - robot1_robotiq_85_left_knuckle_link
      - robot1_robotiq_85_right_finger_link
      - robot1_robotiq_85_right_finger_tip_link
      - robot1_robotiq_85_right_inner_knuckle_link
      - robot1_robotiq_85_right_knuckle_link

  robot2:
    planning_group: manipulator2_on_rail
    arm_group:      manipulator2
    ee_link:        robot2_tool0
    attach_link:    robot2_robotiq_85_base_link
    gripper_action: /robot2_gripper_action_controller/gripper_cmd
    gripper_open:   0.0
    gripper_close:  0.5
    home:
      robot2_linear_guide_joint:  0.0
      robot2_shoulder_pan_joint:  0.0
      robot2_shoulder_lift_joint: -2.6035
      robot2_elbow_joint:         2.1348
      robot2_wrist_1_joint:       -1.1455
      robot2_wrist_2_joint:       -1.7358
      robot2_wrist_3_joint:       0.0
    touch_links:
      - robot2_robotiq_85_base_link
      - robot2_robotiq_85_left_finger_link
      - robot2_robotiq_85_left_finger_tip_link
      - robot2_robotiq_85_left_inner_knuckle_link
      - robot2_robotiq_85_left_knuckle_link
      - robot2_robotiq_85_right_finger_link
      - robot2_robotiq_85_right_finger_tip_link
      - robot2_robotiq_85_right_inner_knuckle_link
      - robot2_robotiq_85_right_knuckle_link

base_frame: world

fixtures:
  - id: door_outer
    size: [0.5965, 0.3763, 0.0851]
    mesh: {file: meshes/door_outer.stl}
    pose: {x: -0.3300, y: 0.0000, z: 0.8225}
  - {id: nest_pad_1, size: [0.0400, 0.0400, 0.0374], pose: {x: -0.5537, y: -0.1411, z: 0.7687}}
  - {id: nest_pad_2, size: [0.0400, 0.0400, 0.0465], pose: {x: -0.5537, y: 0.1411, z: 0.7732}}
