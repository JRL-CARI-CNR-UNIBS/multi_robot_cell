# TEST SCENE -- the synchronous hold on one fin plate of `fabricator` (v2, 2026-09-28): the
# pick-place of fin_1 HOLDS the plate while a two-spot tack (`legs:`) is run by one welder
# (precedence `hold`), then one fillet seam follows (`gate`). Cut from tamp_task_fabricator.yaml
# (make_fabricator.py); a probe for trajectory_generator's legs / hold tail and the seam's
# hold_offsets / process_end_offsets, not a benchmark.
cell: fabricator4
discretisation:
  delta_t:            0.025
  gripper_dwell_slots: 40
  process_dwell_slots: 12      # 0.30 s arc strike / 0.30 s crater fill
  max_joint_step_warn: 0.15
  max_cartesian_step_warn: 0.02

planning:
  planner_id:      RRTConnectkConfigDefault
  planning_time:   20.0
  planning_attempts: 10
  vel_scale:       0.45        # 0.5 gave 0.0219 m of link travel per slot (> 0.02, ADR-0006)
  acc_scale:       0.45
  approach:        0.13
  cartesian_step:  0.005
  max_link_speed:  0.7         # m/s; x delta_t 0.025 = 0.0175 m per slot
  process_speed:   0.009
  hold_slack_s:    2.0
  seed:            7

robots:
  robot1:
    tool:           gripper
    planning_group: manipulator1_on_rail
    arm_group:      manipulator1
    ee_link:        robot1_tool0
    attach_link:    robot1_robotiq_85_base_link
    gripper_action: /robot1_gripper_action_controller/gripper_cmd
    gripper_open:   0.0
    gripper_close:  0.5
    home:
      robot1_linear_guide_joint: 0.0
      robot1_shoulder_pan_joint: 0.0
      robot1_shoulder_lift_joint: -2.6035
      robot1_elbow_joint: 2.1348
      robot1_wrist_1_joint: -1.1455
      robot1_wrist_2_joint: -1.7358
      robot1_wrist_3_joint: 0.0
    touch_links:
      - robot1_robotiq_85_base_link
      - robot1_robotiq_85_left_finger_link
      - robot1_robotiq_85_left_finger_tip_link
      - robot1_robotiq_85_left_inner_knuckle_link
      - robot1_robotiq_85_left_knuckle_link
      - robot1_robotiq_85_right_finger_link
      - robot1_robotiq_85_right_finger_tip_link
      - robot1_robotiq_85_right_inner_knuckle_link
      - robot1_robotiq_85_right_knuckle_link
  robot2:
    tool:           torch
    planning_group: manipulator2_on_rail
    arm_group:      manipulator2
    ee_link:        robot2_torch_tcp
    attach_link:    robot2_torch_link
    weld_tool:      {x: 0.0, y: 0.0, z: 0.0, roll: 3.14159}   # TCP on the waypoint, axis into the joint
    process_links:  [robot2_torch_link]
    tool_axis_free: 8
    weld_approach:  tool
    home:
      robot2_linear_guide_joint: 0.0
      robot2_shoulder_pan_joint: 0.0
      robot2_shoulder_lift_joint: -2.6035
      robot2_elbow_joint: 2.1348
      robot2_wrist_1_joint: -1.1455
      robot2_wrist_2_joint: -1.7358
      robot2_wrist_3_joint: 0.0
    touch_links:
      - robot2_torch_link
  robot3:
    tool:           torch
    planning_group: manipulator3_on_rail
    arm_group:      manipulator3
    ee_link:        robot3_torch_tcp
    attach_link:    robot3_torch_link
    weld_tool:      {x: 0.0, y: 0.0, z: 0.0, roll: 3.14159}   # TCP on the waypoint, axis into the joint
    process_links:  [robot3_torch_link]
    tool_axis_free: 8
    weld_approach:  tool
    home:
      robot3_linear_guide_joint: 0.0
      robot3_shoulder_pan_joint: 0.0
      robot3_shoulder_lift_joint: -2.6035
      robot3_elbow_joint: 2.1348
      robot3_wrist_1_joint: -1.1455
      robot3_wrist_2_joint: -1.7358
      robot3_wrist_3_joint: 0.0
    touch_links:
      - robot3_torch_link
  robot4:
    tool:           torch
    planning_group: manipulator4_on_rail
    arm_group:      manipulator4
    ee_link:        robot4_torch_tcp
    attach_link:    robot4_torch_link
    weld_tool:      {x: 0.0, y: 0.0, z: 0.0, roll: 3.14159}   # TCP on the waypoint, axis into the joint
    process_links:  [robot4_torch_link]
    tool_axis_free: 8
    weld_approach:  tool
    home:
      robot4_linear_guide_joint: 0.0
      robot4_shoulder_pan_joint: 0.0
      robot4_shoulder_lift_joint: -2.6035
      robot4_elbow_joint: 2.1348
      robot4_wrist_1_joint: -1.1455
      robot4_wrist_2_joint: -1.7358
      robot4_wrist_3_joint: 0.0
    touch_links:
      - robot4_torch_link

base_frame: world

# The beam (web + 2 flanges, boxes) on 2 painted-steel trestles (legs, cross rails, saddle,
# a cradle pad under each flange, a low-profile clamp on each flange: a mesh, `size` = its
# bounding box). `color:` is for RViz only.
fixtures:
  - {id: beam_web, size: [1.2000, 0.2600, 0.0200], pose: {x: 0.0000, y: 0.0000, z: 0.9500}, color: [0.55, 0.57, 0.60, 1.00]}
  - {id: beam_flange_p, size: [1.2000, 0.0200, 0.2000], pose: {x: 0.0000, y: 0.1400, z: 0.9500}, color: [0.55, 0.57, 0.60, 1.00]}
  - {id: beam_flange_m, size: [1.2000, 0.0200, 0.2000], pose: {x: 0.0000, y: -0.1400, z: 0.9500}, color: [0.55, 0.57, 0.60, 1.00]}
  - {id: beam_support_m, size: [0.1200, 0.3500, 0.1300], mesh: {file: meshes/fabricator/trestle.stl}, pose: {x: -0.4800, y: 0.0000, z: 0.8150}, color: [0.22, 0.25, 0.28, 1.00]}
  - {id: beam_support_p, size: [0.1200, 0.3500, 0.1300], mesh: {file: meshes/fabricator/trestle.stl}, pose: {x: 0.4800, y: 0.0000, z: 0.8150}, color: [0.22, 0.25, 0.28, 1.00]}

# The plates, standing on the plate table behind robot1 in their placed orientation. The fin
# plates carry two VISUAL bolt holes (a mesh; `size` is its bounding box). The grasp: tool0
# above the middle of the top edge, the fingers closing across the thickness (yaw).
objects:
  - id: fin_1
    size: [0.1800, 0.0200, 0.1890]
    mesh: {file: meshes/fabricator/fin_plate.stl}
    spawn: {x: -0.3150, y: 1.2000, z: 0.8455}
    grasp: {x: 0.0, y: 0.0, z: 0.2145, roll: 3.14159, yaw: 1.57080}
    color: [0.70, 0.72, 0.75, 1.00]
tasks:
  - {id: pp_fin_1, object: fin_1, place: {x: -0.3600, y: 0.0000, z: 1.0555}}

# Seams: 2-waypoint paths (frame z out of the joint, x along the travel). A tack is two
# spots (`legs:`), run by one welder with the arc off between them (off the joint along the
# torch axis by `leg_retreat`, across, back on).
welds:
  - id: t_fin_1
    legs:
      - [{x: -0.4450, y: -0.0100, z: 0.9600, roll: 0.79305, pitch: -0.12310, yaw: -0.12404}, {x: -0.4250, y: -0.0100, z: 0.9600, roll: 0.79305, pitch: -0.12310, yaw: -0.12404}]
      - [{x: -0.2950, y: -0.0100, z: 0.9600, roll: 0.79305, pitch: -0.12310, yaw: -0.12404}, {x: -0.2750, y: -0.0100, z: 0.9600, roll: 0.79305, pitch: -0.12310, yaw: -0.12404}]
    leg_retreat: 0.03
    tool: {x: 0.0, y: 0.0, z: 0.0, roll: 3.14159}
    speed: 0.01
    approach: 0.08
    robots: [robot2, robot3]
    touch: [beam_web, fin_1]
  - id: w_fin_1_m
    path: [{x: -0.4450, y: -0.0100, z: 0.9600, roll: 0.79305, pitch: -0.12310, yaw: -0.12404}, {x: -0.2750, y: -0.0100, z: 0.9600, roll: 0.79305, pitch: -0.12310, yaw: -0.12404}]
    tool: {x: 0.0, y: 0.0, z: 0.0, roll: 3.14159}
    speed: 0.009
    approach: 0.08
    robots: [robot2, robot3]
    touch: [beam_web, fin_1]
precedences:
  - [pp_fin_1, t_fin_1, hold]
  - [t_fin_1, w_fin_1_m]
