  robot1_shoulder_pan_joint:
    has_position_limits: true
    has_velocity_limits: true
    has_acceleration_limits: true # not made publicly available by Universal Robots
    has_effort_limits: true
    max_position: 3.1415926535897931
    min_position: -3.1415926535897931
    max_velocity: 2.0943951023931953
    max_acceleration: 1.0 # rad/s^2 # arbitrarily chosen
    max_effort: 330.0
