# fabricator4 welder robot4: rail + arm controllers only (MIG torch, no gripper controller).

robot4_linear_guide_joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - robot4_linear_guide_joint
      - robot4_shoulder_pan_joint
      - robot4_shoulder_lift_joint
      - robot4_elbow_joint
      - robot4_wrist_1_joint
      - robot4_wrist_2_joint
      - robot4_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 0.0

robot4_joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - robot4_shoulder_pan_joint
      - robot4_shoulder_lift_joint
      - robot4_elbow_joint
      - robot4_wrist_1_joint
      - robot4_wrist_2_joint
      - robot4_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 0.0
      
robot4_scaled_joint_trajectory_controller:
  ros__parameters:
    type: ur_controllers/ScaledJointTrajectoryController
    joints:
      - robot4_linear_guide_joint
      - robot4_shoulder_pan_joint
      - robot4_shoulder_lift_joint
      - robot4_elbow_joint
      - robot4_wrist_1_joint
      - robot4_wrist_2_joint
      - robot4_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 0.0
    speed_scaling_interface_name: robot4/speed_scaling/speed_scaling_factor
