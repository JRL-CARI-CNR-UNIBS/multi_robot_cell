# Cell descriptor read by tamp_core (tamp_core/scripts/cell_registry.py). Paths are relative to
# this directory. The scene's `cell:` key selects it.
name: fabricator4
package: four_robot_cell            # ROS package that installs these files
layout: urdf/fabricator4_layout.yaml
moveit:
  urdf: config/fabricator4_cell.urdf.xacro
  srdf: config/fabricator4_cell.srdf.xacro   # a xacro (generated from the layout)
  joint_limits: config/joint_limits.yaml
  kinematics: config/kinematics.yaml
  ompl: config/ompl_planning.yaml
  controllers: config/fabricator4_moveit_controllers.yaml
scenes: scenes
vamp:
  placement: rail_layout            # base, mount yaw and tool per robot from `layout`
  by_tool:                          # modules: ur10e_rail is declared by dual_robot_cell
    gripper: ur10e_rail
    torch: ur10e_rail_torch
  modules:
    ur10e_rail_torch:               # UR10e + rail + MIG torch (63 spheres)
      dir: vamp_modules/ur10e_rail_torch
      n_structural: 18
